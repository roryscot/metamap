name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The complete native/UID/crash suite takes about 14 minutes on a hosted
    # runner; leave time for the examples and installed-package acceptance too.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run example:generate
      - run: npm run example:check
      - run: npm run example:compile
      - run: npm run example:research
      - run: npm run example:routing
      - run: npm run example:bindings
      - run: npm run example:path-tree
      - run: npm run example:topology
      - run: npm run example:replay
      - name: Ensure example outputs are current
        run: git diff --exit-code examples/workspace/generated examples/research/generated examples/routing/generated examples/routing/bindings/generated examples/path-tree/generated examples/application-topology/generated examples/example-generation.json
      - run: npm pack --dry-run
      - run: npm run verify:package
